<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Risk Prediction Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            padding: 30px; 
            background-color: #f4f6f9; 
        }
        .table-container { 
            background: white; 
            padding: 25px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            overflow-x: auto; 
        }
        h2 { 
            color: #2c3e50; 
            margin-bottom: 20px; 
            font-weight: 600;
        }
        table {
            width: 100%;
            margin-bottom: 0;
        }
        th {
            background-color: #343a40 !important;
            color: white !important;
            white-space: nowrap;
        }
        td {
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h2>Credit Risk Batch Scoring Results</h2>
        <p class="text-muted">Displaying the first 50 records. The complete dataset with predictions has been saved locally.</p>
        
        <div class="table-container">
            {{ table | safe }}
        </div>
        
        <div class="mt-4">
            <a href="/docs" class="btn btn-primary">Return to API Swagger UI</a>
        </div>
    </div>
</body>
</html>
